name: Frontend
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser verification
        run: |
          npm run preview -- --port 4173 > /tmp/mizan-preview.log 2>&1 &
          node -e "(async()=>{for(let i=0;i<50;i++){try{if((await fetch('http://127.0.0.1:4173')).ok)return}catch{}await new Promise(r=>setTimeout(r,200))}process.exit(1)})()"
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-screenshots
          path: frontend/test-results/
